# pi6529 drop-in for 6529's own unit (/lib/systemd/system/6529-validator.service).
# It changes nothing about how the validator runs; it only waits, up to 90
# seconds, for the clock to be set over the network before the validator
# starts. A Raspberry Pi has no battery clock, so right after boot the time is
# wrong until NTP answers, and the validator does not sign with a wrong clock.
# The unit's own start timeout is 90 s, so it is raised to cover the wait.
[Unit]
Wants=pi6529-firstboot.service
After=pi6529-firstboot.service

[Service]
TimeoutStartSec=5min
ExecStartPre=/usr/local/lib/pi6529/wait-for-time 90
